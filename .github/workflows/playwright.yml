name: Smoke Tests

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            - name: Audit dependencies
              run: npm audit --audit-level=high

            - name: Install Playwright browser
              run: npx playwright install --with-deps chromium

            # Secrets arrive through `env:` rather than inline `${{ }}` so their
            # values are never spliced into the script text. The file key is
            # 2FA_SECRET because helpers/iru/totp.ts reads that name; the secret
            # is TOTP_SECRET because GitHub rejects a name with a leading digit.
            - name: Write environment file
              env:
                  APP_URL: ${{ secrets.APP_URL }}
                  APP_EMAIL: ${{ secrets.APP_EMAIL }}
                  APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
                  TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
              run: |
                  for name in APP_URL APP_EMAIL APP_PASSWORD TOTP_SECRET; do
                    if [ -z "${!name}" ]; then
                      echo "::error::Repository secret $name is missing or empty."
                      exit 1
                    fi
                  done
                  mkdir -p env
                  {
                    echo "APP_URL=$APP_URL"
                    echo "APP_EMAIL=$APP_EMAIL"
                    echo "APP_PASSWORD=$APP_PASSWORD"
                    echo "2FA_SECRET=$TOTP_SECRET"
                  } > env/.env

            - name: Run smoke suite
              run: npx playwright test

            - name: Upload report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7
